<!doctype html>

        <title>Semantic Golfer social poster source</title>
        <style>

    </head>
    <body>
        <div class="brand"><img src="../public/icon.svg" alt="" />Semantic Golfer</div>

        <div class="platforms">macOS · Windows · Linux</div>
    </body>
</html>
